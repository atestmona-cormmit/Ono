name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_MOBILE_VERSION: v18.20.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download nodejs-mobile (libnode.so + headers)
        run: |
          curl -fL -o nm.zip "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${NODE_MOBILE_VERSION}/nodejs-mobile-${NODE_MOBILE_VERSION}-android.zip"
          unzip -q nm.zip -d nm
          BIN=$(find nm -type d -name bin | head -1)
          INC=$(find nm -type d -path '*include/node' | head -1)
          echo "BIN=$BIN INC=$INC"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp "$BIN/$abi/libnode.so" app/src/main/jniLibs/$abi/
          done
          mkdir -p app/src/main/cpp/node
          cp -r "$INC"/* app/src/main/cpp/node/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WolfLocal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
