name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o WolfLocal.zip -x ".github/*"
          rm WolfLocal.zip
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unzip project"
          git push
